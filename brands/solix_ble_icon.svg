<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb3a3"/>
      <stop offset="1" stop-color="#1f5fd0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="1" stop-color="#ffb01f"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>

  <!-- portable power-station body -->
  <rect x="120" y="188" width="272" height="196" rx="30" fill="#ffffff" opacity="0.96"/>
  <!-- carry-handle slot -->
  <rect x="214" y="150" width="84" height="46" rx="20" fill="none" stroke="#ffffff" stroke-width="18" opacity="0.95"/>
  <!-- display strip -->
  <rect x="150" y="214" width="150" height="40" rx="10" fill="#1f5fd0" opacity="0.18"/>

  <!-- energy bolt on the unit -->
  <path d="M292 206 L214 322 L262 322 L238 392 L330 268 L278 268 Z" fill="url(#bolt)" stroke="#e59a12" stroke-width="4" stroke-linejoin="round"/>

  <!-- generic wireless waves (local, cloud-free) -->
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.95">
    <path d="M352 312 a40 40 0 0 1 40 40"/>
    <path d="M352 276 a76 76 0 0 1 76 76"/>
  </g>
  <circle cx="356" cy="356" r="12" fill="#ffffff"/>
</svg>
